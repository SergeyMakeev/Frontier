<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="680"
     viewBox="0 0 1000 680" role="img"
     aria-labelledby="title description">
  <title id="title">Median BVH split strategy</title>
  <desc id="description">
    A parent bounding box contains twelve objects. Their centroids are ordered
    along the longest axis, then split at the middle rank so the two child
    groups contain six objects each. The binary rule repeats to fill a wide
    BVH node.
  </desc>
  <defs>
    <marker id="axis-arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" class="arrow-head"/>
    </marker>
    <style>
      text { font-family: Inter, "Segoe UI", Arial, sans-serif; }
      .canvas { fill: #ffffff; }
      .ink { fill: #172033; }
      .muted { fill: #526077; }
      .title { font-size: 27px; font-weight: 600; }
      .subtitle { font-size: 15px; }
      .parent { fill: #f8fafc; stroke: #172033; stroke-width: 3; }
      .parent-tag { fill: #172033; }
      .parent-tag-text { fill: #ffffff; font-size: 12px; font-weight: 700; letter-spacing: .08em; }
      .left-zone { fill: #eff6ff; }
      .right-zone { fill: #f0fdf4; }
      .child-left { fill: #dbeafe; fill-opacity: .38; stroke: #2563eb; stroke-width: 2.5; }
      .child-right { fill: #dcfce7; fill-opacity: .38; stroke: #16a34a; stroke-width: 2.5; }
      .left-ink { fill: #1d4ed8; }
      .right-ink { fill: #15803d; }
      .child-label { font-size: 13px; font-weight: 700; }
      .count-pill-left { fill: #2563eb; }
      .count-pill-right { fill: #16a34a; }
      .count-text { fill: #ffffff; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .object { fill: #64748b; stroke: #334155; stroke-width: 1.2; }
      .centroid { fill: #ffffff; stroke: #172033; stroke-width: 1.5; }
      .split { stroke: #ea580c; stroke-width: 3; stroke-dasharray: 10 6; }
      .split-label-bg { fill: #fff7ed; stroke: #fdba74; stroke-width: 1; }
      .split-label { fill: #c2410c; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .axis { stroke: #ea580c; stroke-width: 2.5; marker-end: url(#axis-arrow); }
      .arrow-head { fill: #ea580c; }
      .axis-label { fill: #c2410c; font-size: 13px; font-weight: 700; }
      .rank-line { stroke: #94a3b8; stroke-width: 2; }
      .rank-dot { fill: #64748b; }
      .rank-mid { stroke: #ea580c; stroke-width: 3; }
      .rank-label { font-size: 11px; text-anchor: middle; }
      .card { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
      .card-title { font-size: 16px; font-weight: 700; }
      .step-number { fill: #2563eb; }
      .step-digit { fill: #ffffff; font-size: 12px; font-weight: 700; text-anchor: middle; }
      .step { font-size: 14px; }
      .result { fill: #eff6ff; stroke: #93c5fd; stroke-width: 1.5; }
      .result-title { fill: #1d4ed8; font-size: 12px; font-weight: 700; letter-spacing: .06em; }
      .result-text { font-size: 13px; }
      .legend { fill: #ffffff; stroke: #cbd5e1; stroke-width: 1.5; }
      .legend-text { font-size: 12px; }
    </style>
    <style media="(prefers-color-scheme: dark)">
      .canvas { fill: #0f172a; }
      .ink { fill: #e5edf8; }
      .muted { fill: #a9b7ca; }
      .parent { fill: #111c31; stroke: #dbe7f5; }
      .parent-tag { fill: #dbe7f5; }
      .parent-tag-text { fill: #0f172a; }
      .left-zone { fill: #10213a; }
      .right-zone { fill: #10291f; }
      .child-left { fill: #183b68; stroke: #60a5fa; }
      .child-right { fill: #123f32; stroke: #4ade80; }
      .left-ink { fill: #93c5fd; }
      .right-ink { fill: #86efac; }
      .object { fill: #94a3b8; stroke: #cbd5e1; }
      .centroid { fill: #0f172a; stroke: #f8fafc; }
      .split { stroke: #fb923c; }
      .split-label-bg { fill: #3a271d; stroke: #fb923c; }
      .split-label { fill: #fdba74; }
      .axis { stroke: #fb923c; }
      .arrow-head { fill: #fb923c; }
      .axis-label { fill: #fdba74; }
      .rank-line { stroke: #64748b; }
      .rank-dot { fill: #94a3b8; }
      .rank-mid { stroke: #fb923c; }
      .card { fill: #111c31; stroke: #475569; }
      .result { fill: #142b4b; stroke: #3b82f6; }
      .result-title { fill: #93c5fd; }
      .legend { fill: #111c31; stroke: #475569; }
    </style>
  </defs>

  <rect class="canvas" width="1000" height="680"/>
  <text class="title ink" x="40" y="46">Median · equal object counts</text>
  <text class="subtitle muted" x="40" y="73">
    Order centroids along the longest axis and split at the middle rank—not at the geometric center.
  </text>

  <rect class="parent" x="60" y="125" width="660" height="410" rx="8"/>
  <rect class="left-zone" x="63" y="128" width="337" height="404"/>
  <rect class="right-zone" x="400" y="128" width="317" height="404"/>
  <rect class="child-left" x="87" y="173" width="291" height="315" rx="5"/>
  <text class="child-label left-ink" x="100" y="196">LEFT CHILD</text>
  <rect class="count-pill-left" x="284" y="183" width="75" height="25" rx="13"/>
  <text class="count-text" x="321.5" y="200">n = 6</text>
  <rect class="child-right" x="426" y="185" width="267" height="303" rx="5"/>
  <text class="child-label right-ink" x="439" y="208">RIGHT CHILD</text>
  <rect class="count-pill-right" x="599" y="195" width="75" height="25" rx="13"/>
  <text class="count-text" x="636.5" y="212">n = 6</text>

  <!-- Six instances on each side of the median rank. -->
  <g transform="rotate(-11 123 245)"><rect class="object" x="101" y="226" width="44" height="38" rx="3"/><circle class="centroid" cx="123" cy="245" r="4"/></g>
  <g transform="rotate(7 185 295)"><rect class="object" x="159" y="275" width="52" height="40" rx="3"/><circle class="centroid" cx="185" cy="295" r="4"/></g>
  <g transform="rotate(-5 260 229)"><rect class="object" x="237" y="211" width="46" height="36" rx="3"/><circle class="centroid" cx="260" cy="229" r="4"/></g>
  <g transform="rotate(10 132 396)"><rect class="object" x="107" y="375" width="50" height="42" rx="3"/><circle class="centroid" cx="132" cy="396" r="4"/></g>
  <g transform="rotate(-8 238 420)"><rect class="object" x="214" y="401" width="48" height="38" rx="3"/><circle class="centroid" cx="238" cy="420" r="4"/></g>
  <g transform="rotate(4 345 338)"><rect class="object" x="321" y="318" width="48" height="40" rx="3"/><circle class="centroid" cx="345" cy="338" r="4"/></g>

  <g transform="rotate(-8 454 271)"><rect class="object" x="431" y="252" width="46" height="38" rx="3"/><circle class="centroid" cx="454" cy="271" r="4"/></g>
  <g transform="rotate(9 504 391)"><rect class="object" x="479" y="370" width="50" height="42" rx="3"/><circle class="centroid" cx="504" cy="391" r="4"/></g>
  <g transform="rotate(-6 546 245)"><rect class="object" x="522" y="226" width="48" height="38" rx="3"/><circle class="centroid" cx="546" cy="245" r="4"/></g>
  <g transform="rotate(7 589 327)"><rect class="object" x="565" y="307" width="48" height="40" rx="3"/><circle class="centroid" cx="589" cy="327" r="4"/></g>
  <g transform="rotate(-10 643 261)"><rect class="object" x="620" y="242" width="46" height="38" rx="3"/><circle class="centroid" cx="643" cy="261" r="4"/></g>
  <g transform="rotate(5 652 437)"><rect class="object" x="628" y="418" width="48" height="38" rx="3"/><circle class="centroid" cx="652" cy="437" r="4"/></g>

  <line class="split" x1="400" y1="128" x2="400" y2="532"/>
  <rect class="split-label-bg" x="345" y="137" width="110" height="27" rx="6"/>
  <text class="split-label" x="400" y="155">MEDIAN RANK</text>
  <rect class="parent-tag" x="74" y="108" width="112" height="27" rx="5"/>
  <text class="parent-tag-text" x="87" y="126">PARENT NODE</text>

  <!-- Ordered-centroid rank strip. -->
  <line class="rank-line" x1="92" y1="558" x2="690" y2="558"/>
  <line class="rank-mid" x1="391" y1="547" x2="391" y2="569"/>
  <circle class="rank-dot" cx="112" cy="558" r="5"/><circle class="rank-dot" cx="162" cy="558" r="5"/>
  <circle class="rank-dot" cx="212" cy="558" r="5"/><circle class="rank-dot" cx="262" cy="558" r="5"/>
  <circle class="rank-dot" cx="312" cy="558" r="5"/><circle class="rank-dot" cx="362" cy="558" r="5"/>
  <circle class="rank-dot" cx="420" cy="558" r="5"/><circle class="rank-dot" cx="470" cy="558" r="5"/>
  <circle class="rank-dot" cx="520" cy="558" r="5"/><circle class="rank-dot" cx="570" cy="558" r="5"/>
  <circle class="rank-dot" cx="620" cy="558" r="5"/><circle class="rank-dot" cx="670" cy="558" r="5"/>
  <text class="rank-label muted" x="241" y="580">first 6 ranks</text>
  <text class="rank-label muted" x="545" y="580">last 6 ranks</text>
  <line class="axis" x1="92" y1="597" x2="704" y2="597"/>
  <text class="axis-label" x="92" y="621">centroid order along X</text>

  <rect class="card" x="750" y="125" width="220" height="410" rx="10"/>
  <text class="card-title ink" x="770" y="157">Partition rule</text>
  <circle class="step-number" cx="783" cy="190" r="13"/><text class="step-digit" x="783" y="194">1</text>
  <text class="step ink" x="807" y="187"><tspan x="807">Find the longest</tspan><tspan x="807" dy="19">centroid axis.</tspan></text>
  <circle class="step-number" cx="783" cy="245" r="13"/><text class="step-digit" x="783" y="249">2</text>
  <text class="step ink" x="807" y="242"><tspan x="807">Select the middle</tspan><tspan x="807" dy="19">centroid rank.</tspan></text>
  <circle class="step-number" cx="783" cy="300" r="13"/><text class="step-digit" x="783" y="304">3</text>
  <text class="step ink" x="807" y="297"><tspan x="807">Put half the objects</tspan><tspan x="807" dy="19">on each side.</tspan></text>
  <circle class="step-number" cx="783" cy="355" r="13"/><text class="step-digit" x="783" y="359">4</text>
  <text class="step ink" x="807" y="352"><tspan x="807">Repeat binary splits</tspan><tspan x="807" dy="19">to fill wide lanes.</tspan></text>
  <rect class="result" x="770" y="405" width="180" height="105" rx="8"/>
  <text class="result-title" x="784" y="428">KEY PROPERTY</text>
  <text class="result-text ink" x="784" y="452"><tspan x="784">Balanced populations;</tspan><tspan x="784" dy="19">spatial widths and areas</tspan><tspan x="784" dy="19">may differ.</tspan></text>

  <rect class="legend" x="750" y="555" width="220" height="75" rx="8"/>
  <text class="legend-text ink" x="770" y="580">One binary step shown.</text>
  <text class="legend-text muted" x="770" y="602">BVH4 repeats 2 levels;</text>
  <text class="legend-text muted" x="770" y="620">BVH8 repeats 3 levels.</text>
</svg>
