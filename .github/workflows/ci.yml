name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux x86-64: GCC and Clang, AVX2 / SSE2 / scalar ----------
          - name: linux-x64-gcc-avx2
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=g++ -DHLOD_AVX2=ON
          - name: linux-x64-gcc-sse2
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=g++ -DHLOD_AVX2=OFF
          - name: linux-x64-gcc-scalar
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=g++ -DHLOD_AVX2=OFF -DHLOD_FORCE_SCALAR=ON
          - name: linux-x64-clang-avx2
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=clang++ -DHLOD_AVX2=ON
          - name: linux-x64-clang-sse2
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=clang++ -DHLOD_AVX2=OFF
          - name: linux-x64-clang-scalar
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=clang++ -DHLOD_AVX2=OFF -DHLOD_FORCE_SCALAR=ON

          # ---- Linux ARM64: GCC and Clang, NEON / scalar -------------------
          - name: linux-arm64-gcc-neon
            os: ubuntu-24.04-arm
            cmake_args: -DCMAKE_CXX_COMPILER=g++
          - name: linux-arm64-gcc-scalar
            os: ubuntu-24.04-arm
            cmake_args: -DCMAKE_CXX_COMPILER=g++ -DHLOD_FORCE_SCALAR=ON
          - name: linux-arm64-clang-neon
            os: ubuntu-24.04-arm
            cmake_args: -DCMAKE_CXX_COMPILER=clang++
          - name: linux-arm64-clang-scalar
            os: ubuntu-24.04-arm
            cmake_args: -DCMAKE_CXX_COMPILER=clang++ -DHLOD_FORCE_SCALAR=ON

          # ---- Windows x86-64: MSVC (AVX2 / SSE2 / scalar) and clang-cl ----
          - name: windows-x64-msvc-avx2
            os: windows-latest
            cmake_args: -DHLOD_AVX2=ON
          - name: windows-x64-msvc-sse2
            os: windows-latest
            cmake_args: -DHLOD_AVX2=OFF
          - name: windows-x64-msvc-scalar
            os: windows-latest
            cmake_args: -DHLOD_AVX2=OFF -DHLOD_FORCE_SCALAR=ON
          - name: windows-x64-clangcl-avx2
            os: windows-latest
            cmake_args: -T ClangCL -DHLOD_AVX2=ON
          - name: windows-x64-clangcl-sse2
            os: windows-latest
            cmake_args: -T ClangCL -DHLOD_AVX2=OFF

          # ---- Windows ARM64: MSVC, NEON / scalar --------------------------
          - name: windows-arm64-msvc-neon
            os: windows-11-arm
            cmake_args: ""
          - name: windows-arm64-msvc-scalar
            os: windows-11-arm
            cmake_args: -DHLOD_FORCE_SCALAR=ON

          # ---- macOS Apple Silicon: AppleClang, NEON / scalar --------------
          - name: macos-arm64-clang-neon
            os: macos-latest
            cmake_args: ""
          - name: macos-arm64-clang-scalar
            os: macos-latest
            cmake_args: -DHLOD_FORCE_SCALAR=ON

          # ---- macOS Intel: AppleClang, AVX2 / SSE2 / scalar ---------------
          - name: macos-x64-clang-avx2
            os: macos-15-intel
            cmake_args: -DHLOD_AVX2=ON
          - name: macos-x64-clang-sse2
            os: macos-15-intel
            cmake_args: -DHLOD_AVX2=OFF
          - name: macos-x64-clang-scalar
            os: macos-15-intel
            cmake_args: -DHLOD_AVX2=OFF -DHLOD_FORCE_SCALAR=ON

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Unit tests
        run: ctest --test-dir build -C Release --output-on-failure --parallel 4

      - name: Performance tests
        shell: bash
        run: |
          if [ -x build/bench/hlod_bench ]; then
            BENCH=build/bench/hlod_bench
          else
            BENCH=build/bench/Release/hlod_bench.exe
          fi
          "$BENCH" --benchmark_min_time=0.1s \
                   --benchmark_out=bench-${{ matrix.name }}.json \
                   --benchmark_out_format=json

      # Short retention: these are merged into the single bench-all artifact
      # by the collect-bench job below.
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.name }}
          path: bench-${{ matrix.name }}.json
          retention-days: 3

  collect-bench:
    name: collect-bench-results
    needs: build-test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          merge-multiple: true
          path: bench

      - name: Merge results
        shell: python
        run: |
          import csv, glob, json, os

          rows = {}       # benchmark name -> {config: cpu_time in us}
          configs = []
          merged = {}
          scale = {"ns": 1e-3, "us": 1.0, "ms": 1e3, "s": 1e6}

          for path in sorted(glob.glob("bench/bench-*.json")):
              cfg = os.path.basename(path)[len("bench-"):-len(".json")]
              configs.append(cfg)
              with open(path) as f:
                  data = json.load(f)
              merged[cfg] = data
              for b in data.get("benchmarks", []):
                  if b.get("run_type") == "aggregate":
                      continue
                  us = b["cpu_time"] * scale[b.get("time_unit", "ns")]
                  rows.setdefault(b["name"], {})[cfg] = us

          with open("bench-all.json", "w") as f:
              json.dump(merged, f, indent=1)

          with open("bench-all.csv", "w", newline="") as f:
              w = csv.writer(f)
              w.writerow(["benchmark (cpu_time, us)"] + configs)
              for name, per in rows.items():
                  w.writerow([name] +
                             [format(per[c], ".4g") if c in per else "" for c in configs])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "w") as f:
              f.write("## Benchmark results (cpu_time, microseconds)\n\n")
              f.write("Full data: `bench-all` artifact "
                      "(bench-all.csv / bench-all.json).\n\n")
              f.write("| benchmark | " + " | ".join(configs) + " |\n")
              f.write("|---" * (len(configs) + 1) + "|\n")
              for name, per in rows.items():
                  cells = [format(per[c], ".4g") if c in per else "" for c in configs]
                  f.write("| " + name + " | " + " | ".join(cells) + " |\n")

      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: bench-all
          path: |
            bench-all.json
            bench-all.csv
