name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # ---- Linux x86-64: GCC and Clang, AVX2 / SSE2 / scalar ----------
          - name: linux-x64-gcc-avx2
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=g++ -DFRONTIER_AVX2=ON
          - name: linux-x64-gcc-sse2-trusted-subtrees
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=g++ -DFRONTIER_AVX2=OFF -DFRONTIER_BVH_WIDTH=4 -DFRONTIER_VALIDATE_SUBTREES=OFF
          - name: linux-x64-gcc-scalar
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=g++ -DFRONTIER_AVX2=OFF -DFRONTIER_FORCE_SCALAR=ON
          - name: linux-x64-clang-avx2
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=clang++ -DFRONTIER_AVX2=ON -DFRONTIER_TEST_PAYLOAD32=ON
          - name: linux-x64-clang-sse2
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=clang++ -DFRONTIER_AVX2=OFF
          - name: linux-x64-clang-scalar
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=clang++ -DFRONTIER_AVX2=OFF -DFRONTIER_FORCE_SCALAR=ON

          # ---- Linux ARM64: GCC and Clang, NEON / scalar -------------------
          - name: linux-arm64-gcc-neon
            os: ubuntu-24.04-arm
            cmake_args: -DCMAKE_CXX_COMPILER=g++ -DFRONTIER_BVH_WIDTH=4
          - name: linux-arm64-gcc-scalar
            os: ubuntu-24.04-arm
            cmake_args: -DCMAKE_CXX_COMPILER=g++ -DFRONTIER_FORCE_SCALAR=ON
          - name: linux-arm64-clang-neon
            os: ubuntu-24.04-arm
            cmake_args: -DCMAKE_CXX_COMPILER=clang++
          - name: linux-arm64-clang-scalar
            os: ubuntu-24.04-arm
            cmake_args: -DCMAKE_CXX_COMPILER=clang++ -DFRONTIER_FORCE_SCALAR=ON

          # ---- Windows x86-64: MSVC (AVX2 / SSE2 / scalar) and clang-cl ----
          - name: windows-x64-msvc-avx2
            os: windows-latest
            cmake_args: -DFRONTIER_AVX2=ON
          - name: windows-x64-msvc-sse2
            os: windows-latest
            cmake_args: -DFRONTIER_AVX2=OFF -DFRONTIER_BVH_WIDTH=4
          - name: windows-x64-msvc-scalar
            os: windows-latest
            cmake_args: -DFRONTIER_AVX2=OFF -DFRONTIER_FORCE_SCALAR=ON
          - name: windows-x64-clangcl-avx2
            os: windows-latest
            cmake_args: -T ClangCL -DFRONTIER_AVX2=ON
          - name: windows-x64-clangcl-sse2
            os: windows-latest
            cmake_args: -T ClangCL -DFRONTIER_AVX2=OFF

          # ---- Windows ARM64: MSVC, NEON / scalar --------------------------
          - name: windows-arm64-msvc-neon
            os: windows-11-arm
            cmake_args: ""
          - name: windows-arm64-msvc-scalar
            os: windows-11-arm
            cmake_args: -DFRONTIER_FORCE_SCALAR=ON

          # ---- macOS Apple Silicon: AppleClang, NEON / scalar --------------
          - name: macos-arm64-clang-neon
            os: macos-latest
            cmake_args: ""
          - name: macos-arm64-clang-scalar
            os: macos-latest
            cmake_args: -DFRONTIER_FORCE_SCALAR=ON

          # ---- macOS Intel: AppleClang, AVX2 / SSE2 / scalar ---------------
          - name: macos-x64-clang-avx2
            os: macos-15-intel
            cmake_args: -DFRONTIER_AVX2=ON
          - name: macos-x64-clang-sse2
            os: macos-15-intel
            cmake_args: -DFRONTIER_AVX2=OFF
          - name: macos-x64-clang-scalar
            os: macos-15-intel
            cmake_args: -DFRONTIER_AVX2=OFF -DFRONTIER_FORCE_SCALAR=ON

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DFRONTIER_BUILD_TESTS=ON
          -DFRONTIER_BUILD_BENCH=OFF
          -DFRONTIER_CONTRACT_CHECKS=ON
          -DFRONTIER_VALIDATE_SUBTREES=ON
          ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build build --config Debug --parallel 4 --target frontier_unit_tests

      - name: Unit tests (BVH4 + BVH8)
        run: ctest --test-dir build -C Debug --output-on-failure --parallel 4

  performance:
    name: perf-${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64-gcc-avx2
            os: ubuntu-latest
            cmake_args: -DCMAKE_CXX_COMPILER=g++ -DFRONTIER_AVX2=ON
          - name: linux-arm64-gcc-neon
            os: ubuntu-24.04-arm
            cmake_args: -DCMAKE_CXX_COMPILER=g++ -DFRONTIER_AVX2=OFF
          - name: windows-x64-msvc-avx2
            os: windows-latest
            cmake_args: -DFRONTIER_AVX2=ON
          - name: windows-arm64-msvc-neon
            os: windows-11-arm
            cmake_args: -DFRONTIER_AVX2=OFF
          - name: macos-arm64-clang-neon
            os: macos-latest
            cmake_args: -DFRONTIER_AVX2=OFF
          - name: macos-x64-clang-avx2
            os: macos-15-intel
            cmake_args: -DFRONTIER_AVX2=ON

    steps:
      - uses: actions/checkout@v4

      - name: Configure maximum-performance build
        run: >-
          cmake -S . -B build-perf
          -DCMAKE_BUILD_TYPE=Release
          -DFRONTIER_IPO=ON
          -DFRONTIER_BUILD_TESTS=OFF
          -DFRONTIER_BUILD_BENCH=ON
          -DFRONTIER_BVH_WIDTH=AUTO
          -DFRONTIER_FORCE_SCALAR=OFF
          -DFRONTIER_STATS=OFF
          -DFRONTIER_CONTRACT_CHECKS=OFF
          -DFRONTIER_VALIDATE_SUBTREES=OFF
          ${{ matrix.cmake_args }}

      - name: Build performance tests
        run: >-
          cmake --build build-perf --config Release --parallel 4
          --target frontier_bench frontier_bench_payload32

      - name: Performance tests
        shell: bash
        run: |
          if [ -x build-perf/bench/frontier_bench ]; then
            BENCH64=build-perf/bench/frontier_bench
            BENCH32=build-perf/bench/frontier_bench_payload32
          else
            BENCH64=build-perf/bench/Release/frontier_bench.exe
            BENCH32=build-perf/bench/Release/frontier_bench_payload32.exe
          fi
          "$BENCH64" --benchmark_min_time=0.1s \
                      --benchmark_out=bench-${{ matrix.name }}-payload64.json \
                      --benchmark_out_format=json
          "$BENCH32" --benchmark_min_time=0.1s \
                      --benchmark_out=bench-${{ matrix.name }}-payload32.json \
                      --benchmark_out_format=json

      # Short retention: these are merged into the single bench-all artifact
      # by the collect-bench job below.
      - name: Upload benchmark results
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.name }}
          path: bench-${{ matrix.name }}-payload*.json
          retention-days: 3

  sanitizers:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-clang-address-undefined
            compiler: clang++
            flags: -fsanitize=address,undefined -fno-omit-frame-pointer
          - name: linux-gcc-thread
            compiler: g++
            flags: -fsanitize=thread -fno-omit-frame-pointer
    env:
      ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
      UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
      TSAN_OPTIONS: halt_on_error=1
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build-sanitize
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=${{ matrix.compiler }}
          -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"
          -DCMAKE_EXE_LINKER_FLAGS="${{ matrix.flags }}"
          -DFRONTIER_BUILD_TESTS=ON
          -DFRONTIER_BUILD_BENCH=OFF
          -DFRONTIER_AVX2=OFF

      - name: Build
        run: cmake --build build-sanitize --parallel 4

      - name: Sanitized tests
        run: ctest --test-dir build-sanitize --output-on-failure --parallel 4

  no-exceptions:
    name: linux-clang-no-exceptions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build-no-exceptions
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fno-exceptions"
          -DFRONTIER_BUILD_TESTS=OFF
          -DFRONTIER_BUILD_BENCH=OFF
          -DFRONTIER_AVX2=OFF

      - name: Build
        run: cmake --build build-no-exceptions --parallel 4

  coverage:
    name: linux-clang-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build-coverage
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_C_COMPILER=clang
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fprofile-instr-generate -fcoverage-mapping"
          -DCMAKE_EXE_LINKER_FLAGS="-fprofile-instr-generate -fcoverage-mapping"
          -DFRONTIER_BUILD_TESTS=ON
          -DFRONTIER_BUILD_BENCH=OFF
          -DFRONTIER_AVX2=OFF

      - name: Build
        run: cmake --build build-coverage --parallel 4

      - name: Instrumented tests
        env:
          LLVM_PROFILE_FILE: ${{ github.workspace }}/build-coverage/coverage-%p.profraw
        run: ctest --test-dir build-coverage --output-on-failure --parallel 4

      - name: Coverage report
        shell: bash
        run: |
          llvm-profdata merge -sparse \
            build-coverage/coverage-*.profraw \
            -o build-coverage/coverage.profdata
          llvm-cov report build-coverage/tests/frontier_tests \
            -instr-profile=build-coverage/coverage.profdata \
            -ignore-filename-regex='(_deps|/tests/|/usr/|/opt/)' \
            | tee build-coverage/coverage.txt
          llvm-cov export build-coverage/tests/frontier_tests \
            -instr-profile=build-coverage/coverage.profdata \
            -ignore-filename-regex='(_deps|/tests/|/usr/|/opt/)' \
            -format=lcov > build-coverage/coverage.lcov
          {
            echo '## Library coverage'
            echo
            echo '```text'
            cat build-coverage/coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-linux-clang
          path: |
            build-coverage/coverage.txt
            build-coverage/coverage.lcov

  collect-bench:
    name: collect-bench-results
    needs: performance
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Download all benchmark artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bench-*
          merge-multiple: true
          path: bench

      - name: Merge results
        shell: python
        run: |
          import csv, glob, json, os

          rows = {}       # benchmark name -> {config: cpu_time in us}
          configs = []
          merged = {}
          scale = {"ns": 1e-3, "us": 1.0, "ms": 1e3, "s": 1e6}

          for path in sorted(glob.glob("bench/bench-*.json")):
              cfg = os.path.basename(path)[len("bench-"):-len(".json")]
              configs.append(cfg)
              with open(path) as f:
                  data = json.load(f)
              merged[cfg] = data
              for b in data.get("benchmarks", []):
                  if b.get("run_type") == "aggregate":
                      continue
                  us = b["cpu_time"] * scale[b.get("time_unit", "ns")]
                  rows.setdefault(b["name"], {})[cfg] = us

          with open("bench-all.json", "w") as f:
              json.dump(merged, f, indent=1)

          with open("bench-all.csv", "w", newline="") as f:
              w = csv.writer(f)
              w.writerow(["benchmark (cpu_time, us)"] + configs)
              for name, per in rows.items():
                  w.writerow([name] +
                             [format(per[c], ".4g") if c in per else "" for c in configs])

          with open(os.environ["GITHUB_STEP_SUMMARY"], "w") as f:
              f.write("## Benchmark results (cpu_time, microseconds)\n\n")
              f.write("Full data: `bench-all` artifact "
                      "(bench-all.csv / bench-all.json).\n\n")
              f.write("| benchmark | " + " | ".join(configs) + " |\n")
              f.write("|---" * (len(configs) + 1) + "|\n")
              for name, per in rows.items():
                  cells = [format(per[c], ".4g") if c in per else "" for c in configs]
                  f.write("| " + name + " | " + " | ".join(cells) + " |\n")

      - name: Upload combined results
        uses: actions/upload-artifact@v4
        with:
          name: bench-all
          path: |
            bench-all.json
            bench-all.csv
